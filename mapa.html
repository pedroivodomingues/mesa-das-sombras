<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mesa das Sombras — Mapa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;user-select:none}
#canvas{position:absolute;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}

/* TOP BAR */
#topbar{
  position:absolute;top:0;left:0;right:0;height:34px;
  background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.6));
  border-bottom:1px solid #5a3a00;
  display:flex;align-items:center;padding:0 8px;gap:10px;
  pointer-events:all;
}
#pj-hdr{font-size:12px;font-weight:700;color:#f0d060;font-family:'Courier New',monospace;text-shadow:0 0 6px #f0d06066;min-width:60px}
.hpbar{width:65px;height:9px;background:#1a0000;border:1px solid #400;border-radius:1px;overflow:hidden}
.hpfill{height:100%;transition:width .3s}
.hplbl{font-size:10px;color:#999;font-family:'Courier New',monospace}
#loc-name{margin-left:auto;font-size:11px;color:#a08030;font-family:'Courier New',monospace}
#compass{font-size:16px;margin-left:6px}

/* NARRAÇÃO */
#narr{
  position:absolute;top:42px;left:50%;transform:translateX(-50%);
  width:min(86vw,500px);
  background:rgba(0,0,0,.9);border:2px solid #7a5a10;border-radius:2px;
  padding:9px 32px 9px 12px;font-size:13px;line-height:1.5;color:#f0e0a0;
  display:none;pointer-events:all;
  box-shadow:0 3px 16px rgba(0,0,0,.8),inset 0 0 20px rgba(60,40,0,.15);
  font-family:'Courier New',monospace;
}
#narr-who{font-size:9px;color:#c8a030;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
#narr-x{position:absolute;top:5px;right:8px;background:transparent;border:none;color:#555;font-size:14px;pointer-events:all;cursor:pointer}

/* BOTÕES ESQUERDA */
#lbtns{
  position:absolute;left:0;top:34px;bottom:46px;width:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;pointer-events:all;
}
.lbtn{
  width:52px;height:52px;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:2px solid;font-size:9px;font-weight:700;
  font-family:'Courier New',monospace;
}
.lbtn-ic{font-size:16px;line-height:1}

/* BOTÕES DIREITA */
#rbtns{
  position:absolute;right:0;top:34px;bottom:46px;width:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;pointer-events:all;
}

/* TOOLBAR BAIXO */
#tbar{
  position:absolute;bottom:0;left:0;right:0;height:46px;
  background:linear-gradient(0,rgba(0,0,0,.92),rgba(0,0,0,.65));
  border-top:1px solid #5a3a00;
  display:flex;align-items:center;gap:4px;padding:0 5px;
  pointer-events:all;overflow-x:auto;
}
.tbtn{
  height:34px;padding:0 9px;border-radius:2px;font-size:11px;font-weight:700;
  border:1px solid;white-space:nowrap;flex-shrink:0;
  font-family:'Courier New',monospace;display:flex;align-items:center;gap:3px;
}

/* COMBATE BTN */
#combate-btn{
  position:absolute;bottom:54px;left:50%;transform:translateX(-50%);
  padding:10px 24px;background:linear-gradient(135deg,#600,#b00);
  border:2px solid #f44;border-radius:2px;color:#fff;
  font-size:13px;font-weight:900;letter-spacing:2px;
  font-family:'Courier New',monospace;
  box-shadow:0 0 18px rgba(255,0,0,.5);display:none;pointer-events:all;
  animation:blink .7s ease-in-out infinite;
}
@keyframes blink{0%,100%{box-shadow:0 0 12px rgba(255,0,0,.4)}50%{box-shadow:0 0 28px rgba(255,0,0,.9)}}

/* MINIMAP */
#mm{
  position:absolute;bottom:54px;right:3px;
  width:88px;height:68px;border:2px solid #5a3a00;border-radius:2px;
  overflow:hidden;pointer-events:none;background:#000;
}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.mbox{
  background:linear-gradient(160deg,#080600,#140e00);
  border:2px solid #7a5a10;border-radius:3px;
  padding:16px;width:100%;max-width:340px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 30px rgba(120,80,0,.3);
}
.mbox h3{color:#f0d060;font-size:13px;margin-bottom:10px;border-bottom:1px solid #3a2800;padding-bottom:7px;font-family:'Courier New',monospace;letter-spacing:1px}
.mi{width:100%;padding:7px 9px;background:#030200;border:1px solid #5a4008;border-radius:2px;color:#f0e0a0;font-size:12px;outline:none;margin-bottom:5px;font-family:'Courier New',monospace}
.mi:focus{border-color:#c8a030}
.ml{font-size:9px;color:#906820;font-weight:700;letter-spacing:1px;margin-bottom:2px;margin-top:6px;display:block;font-family:'Courier New',monospace}
.mb{width:100%;padding:8px;border-radius:2px;font-size:11px;font-weight:700;border:none;margin-top:5px;cursor:pointer;font-family:'Courier New',monospace;letter-spacing:1px}
.mbg2{background:#162800;color:#80ee80;border:1px solid #2a7000}
.mbr{background:#280000;color:#ee8080;border:1px solid #700000}
.mbc{background:#181000;color:#c8a030;border:1px solid #3a2800}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.tgb{padding:4px 8px;border-radius:2px;border:1px solid #3a2800;background:#100c00;color:#906820;font-size:10px;cursor:pointer;font-family:'Courier New',monospace}
.tgb:hover,.tgb.on{border-color:#f0d060;color:#f0d060;background:#1e1800}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div id="topbar">
    <span id="pj-hdr">Herói</span>
    <span class="hplbl">HP</span>
    <div class="hpbar"><div class="hpfill" id="bar-hp" style="background:linear-gradient(90deg,#800,#c30);width:100%"></div></div>
    <span class="hplbl" id="txt-hp">30/30</span>
    <span class="hplbl">MP</span>
    <div class="hpbar"><div class="hpfill" id="bar-mp" style="background:linear-gradient(90deg,#008,#00c);width:100%"></div></div>
    <span class="hplbl" id="txt-mp">20/20</span>
    <span id="loc-name">Floresta</span>
    <span id="compass">🧭</span>
  </div>

  <div id="narr">
    <button id="narr-x" onclick="closeNarr()">✕</button>
    <div id="narr-who">🐉 MESTRE</div>
    <div id="narr-txt"></div>
  </div>

  <!-- Esquerda -->
  <div id="lbtns">
    <button class="lbtn" style="background:rgba(0,0,50,.85);border-color:#2255bb;color:#88aaff" onclick="showM('m-pj')">
      <div class="lbtn-ic">👤</div>PJ
    </button>
    <button class="lbtn" style="background:rgba(50,0,0,.85);border-color:#bb2222;color:#ff8888" onclick="showM('m-ini')">
      <div class="lbtn-ic">💀</div>Inimigo
    </button>
    <button class="lbtn" style="background:rgba(0,45,0,.85);border-color:#226622;color:#88cc88" onclick="showM('m-npc')">
      <div class="lbtn-ic">🧙</div>NPC
    </button>
    <button class="lbtn" style="background:rgba(40,28,0,.85);border-color:#886600;color:#ffcc44" onclick="showM('m-cen')">
      <div class="lbtn-ic">🗺️</div>Cena
    </button>
  </div>

  <!-- Direita -->
  <div id="rbtns">
    <button class="lbtn" style="background:rgba(45,30,0,.85);border-color:#996600;color:#ffdd66" onclick="quickAct('examinar')">
      <div class="lbtn-ic">🔍</div>Examinar
    </button>
    <button class="lbtn" style="background:rgba(0,30,45,.85);border-color:#006688;color:#88ccff" onclick="quickAct('falar')">
      <div class="lbtn-ic">💬</div>Falar
    </button>
    <button class="lbtn" style="background:rgba(0,38,0,.85);border-color:#005500;color:#88ff88" onclick="quickAct('pegar')">
      <div class="lbtn-ic">🎒</div>Pegar
    </button>
    <button class="lbtn" style="background:rgba(40,0,40,.85);border-color:#660066;color:#ff88ff" onclick="quickAct('magia')">
      <div class="lbtn-ic">🔮</div>Magia
    </button>
  </div>

  <div id="tbar">
    <button class="tbtn" style="background:rgba(36,24,0,.9);border-color:#886600;color:#ffcc44" onclick="showM('m-narr')">📖 Narrar</button>
    <button class="tbtn" style="background:rgba(50,0,0,.9);border-color:#aa0000;color:#ff8888" onclick="goCombate()">⚔️ Combate</button>
    <button class="tbtn" style="background:rgba(0,32,0,.9);border-color:#005500;color:#88ff88" onclick="rollD(20)">🎲 D20</button>
    <button class="tbtn" style="background:rgba(20,15,0,.9);border-color:#554400;color:#ffaa44" onclick="showM('m-inv')">🎒 Inventário</button>
    <button class="tbtn" style="background:rgba(0,0,0,.9);border-color:#444;color:#aaa" onclick="toggleGrid()">⊞ Grid</button>
    <button class="tbtn" style="background:rgba(0,0,0,.9);border-color:#444;color:#aaa" onclick="centerCam()">⊕ Centro</button>
  </div>

  <button id="combate-btn" onclick="goCombate()">⚔️ COMBATE!</button>
  <div id="mm"><canvas id="mm-c" width="88" height="68"></canvas></div>
</div>

<!-- MODAL NARRAR -->
<div class="mbg" id="m-narr" style="display:none" onclick="if(event.target===this)hideM('m-narr')">
<div class="mbox">
  <h3>📖 NARRAÇÃO</h3>
  <div class="tg" id="narr-tg"></div>
  <textarea class="mi" id="narr-inp" rows="4" placeholder="Descreva a cena..."></textarea>
  <button class="mb mbg2" onclick="postNarr()">📢 Publicar na Cena</button>
  <button class="mb mbc" onclick="hideM('m-narr')">Cancelar</button>
</div>
</div>

<!-- MODAL PJ -->
<div class="mbg" id="m-pj" style="display:none" onclick="if(event.target===this)hideM('m-pj')">
<div class="mbox">
  <h3>👤 ADICIONAR PERSONAGEM</h3>
  <span class="ml">Classe</span>
  <div class="tg" id="pj-cls"></div>
  <span class="ml">Nome</span><input class="mi" id="pj-n" placeholder="Thorin">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
    <div><span class="ml">PV</span><input class="mi" type="number" id="pj-hp" value="30"></div>
    <div><span class="ml">CA</span><input class="mi" type="number" id="pj-ca" value="15"></div>
  </div>
  <button class="mb mbg2" onclick="addSpr('pj')">✅ Colocar no Mapa</button>
  <button class="mb mbc" onclick="hideM('m-pj')">Cancelar</button>
</div>
</div>

<!-- MODAL INIMIGO -->
<div class="mbg" id="m-ini" style="display:none" onclick="if(event.target===this)hideM('m-ini')">
<div class="mbox">
  <h3>💀 ADICIONAR INIMIGO</h3>
  <span class="ml">Tipo</span>
  <div class="tg" id="ini-tg"></div>
  <span class="ml">Nome</span><input class="mi" id="ini-n" placeholder="Goblin">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
    <div><span class="ml">PV</span><input class="mi" type="number" id="ini-hp" value="10"></div>
    <div><span class="ml">CA</span><input class="mi" type="number" id="ini-ca" value="12"></div>
    <div><span class="ml">Qtd</span><input class="mi" type="number" id="ini-qtd" value="1" min="1" max="8"></div>
  </div>
  <button class="mb mbr" onclick="addSpr('ini')">💀 Colocar no Mapa</button>
  <button class="mb mbc" onclick="hideM('m-ini')">Cancelar</button>
</div>
</div>

<!-- MODAL NPC -->
<div class="mbg" id="m-npc" style="display:none" onclick="if(event.target===this)hideM('m-npc')">
<div class="mbox">
  <h3>🧙 ADICIONAR NPC</h3>
  <span class="ml">Tipo</span>
  <div class="tg" id="npc-tg"></div>
  <span class="ml">Nome</span><input class="mi" id="npc-n" placeholder="Taverneiro">
  <span class="ml">Fala</span><input class="mi" id="npc-f" placeholder="Bem-vindos, aventureiros...">
  <button class="mb mbg2" onclick="addSpr('npc')">✅ Colocar no Mapa</button>
  <button class="mb mbc" onclick="hideM('m-npc')">Cancelar</button>
</div>
</div>

<!-- MODAL CENÁRIO -->
<div class="mbg" id="m-cen" style="display:none" onclick="if(event.target===this)hideM('m-cen')">
<div class="mbox">
  <h3>🗺️ CENÁRIO</h3>
  <div class="tg" id="cen-tg"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
    <div><span class="ml">Largura (tiles)</span><input class="mi" type="number" id="cen-w" value="80" min="40" max="160"></div>
    <div><span class="ml">Altura (tiles)</span><input class="mi" type="number" id="cen-h" value="60" min="30" max="120"></div>
  </div>
  <span class="ml">Cobertura de árvores</span>
  <input type="range" min="0" max="40" value="15" id="cen-t" style="width:100%;margin:4px 0">
  <span class="ml">Casas e estruturas</span>
  <input type="range" min="0" max="20" value="8" id="cen-b" style="width:100%;margin:4px 0">
  <button class="mb mbg2" onclick="genMap()">🗺️ Gerar Cenário</button>
  <button class="mb mbc" onclick="hideM('m-cen')">Cancelar</button>
</div>
</div>

<!-- MODAL INVENTÁRIO -->
<div class="mbg" id="m-inv" style="display:none" onclick="if(event.target===this)hideM('m-inv')">
<div class="mbox">
  <h3>🎒 INVENTÁRIO</h3>
  <div id="inv-list" style="min-height:40px;font-size:11px;color:#a08030;margin-bottom:8px;font-family:'Courier New',monospace"></div>
  <div style="display:flex;gap:5px">
    <input class="mi" id="inv-add" placeholder="Adicionar item..." style="flex:1;margin:0">
    <button onclick="invAdd()" style="padding:7px 11px;background:#162800;border:1px solid #2a7000;border-radius:2px;color:#80ee80;font-size:12px">+</button>
  </div>
  <button class="mb mbc" style="margin-top:8px" onclick="hideM('m-inv')">Fechar</button>
</div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
// CONSTANTES DE CENÁRIO
// ═══════════════════════════════════════════════════════
const TS=16; // tile size em pixels base

const CENS={
  floresta:{n:'Floresta',
    ground:[[0.50,'#2d6b1a'],[0.15,'#326618'],[0.12,'#3a7a20'],[0.10,'#254d16'],[0.08,'#1a4010'],[0.05,'#4a8a25']],
    water:'#1a4a8a', waterEdge:'#1e5aaa',
    road:'#5a4520', roadEdge:'#4a3818',
    treeProb:.15, buildProb:.04,
    buildColors:['#5a3a18','#6a4820','#7a5830'],
    roofColors:['#4a2810','#3a2008','#5a3418'],
  },
  dungeon:{n:'Dungeon',
    ground:[[0.55,'#2a2a2a'],[0.20,'#222'],[0.15,'#333'],[0.10,'#1e1e1e']],
    water:'#0a0a2a', waterEdge:'#0e0e3a',
    road:'#1a1a1a', roadEdge:'#111',
    treeProb:.05, buildProb:.08,
    buildColors:['#3a3a4a','#2a2a3a','#444454'],
    roofColors:['#252535','#1a1a28','#303040'],
  },
  deserto:{n:'Deserto',
    ground:[[0.50,'#c8a84a'],[0.20,'#d4b455'],[0.15,'#bc9c3e'],[0.10,'#e0c060'],[0.05,'#b08838']],
    water:'#1a3a8a', waterEdge:'#1e4a9a',
    road:'#a88840', roadEdge:'#907030',
    treeProb:.03, buildProb:.05,
    buildColors:['#d4a050','#c89040','#e0b060'],
    roofColors:['#b87830','#a06820','#cc9040'],
  },
  cidade:{n:'Cidade',
    ground:[[0.30,'#5a5a5a'],[0.25,'#484848'],[0.25,'#666'],[0.20,'#707070']],
    water:'#1a3a6a', waterEdge:'#1e4a7a',
    road:'#3a3a3a', roadEdge:'#2a2a2a',
    treeProb:.06, buildProb:.15,
    buildColors:['#707070','#808080','#909090','#606060','#c8a050'],
    roofColors:['#505050','#404040','#606060','#8a5030'],
  },
  taverna:{n:'Taverna',
    ground:[[0.40,'#5a3818'],[0.30,'#6a4820'],[0.20,'#4a2c10'],[0.10,'#7a5828']],
    water:'#1a2a4a', waterEdge:'#1e3a5a',
    road:'#3a2810', roadEdge:'#2a1c08',
    treeProb:.04, buildProb:.20,
    buildColors:['#8a5830','#7a4820','#9a6840','#6a3818'],
    roofColors:['#6a3818','#5a2c10','#7a4820','#4a2010'],
  },
  caverna:{n:'Caverna',
    ground:[[0.50,'#151515'],[0.25,'#0d0d0d'],[0.15,'#1a1a1a'],[0.10,'#111']],
    water:'#050520', waterEdge:'#080830',
    road:'#0d0d0d', roadEdge:'#080808',
    treeProb:.02, buildProb:.06,
    buildColors:['#252530','#1a1a25','#2f2f3a'],
    roofColors:['#1a1a22','#111118','#222230'],
  },
};

const PJ_CLS=[
  {n:'Guerreiro',bc:'#8080b0',hc:'#c0c0d0',sc:'#d0c060'},
  {n:'Mago',     bc:'#4040a0',hc:'#6060c0',sc:'#8040d0'},
  {n:'Arqueiro', bc:'#8a6a30',hc:'#aa8840',sc:'#60a030'},
  {n:'Paladino', bc:'#d0c080',hc:'#e0d0a0',sc:'#c0a040'},
  {n:'Ladino',   bc:'#303040',hc:'#404050',sc:'#202030'},
  {n:'Druida',   bc:'#3a7020',hc:'#4a8830',sc:'#285010'},
  {n:'Bardo',    bc:'#c04080',hc:'#d05090',sc:'#a03060'},
  {n:'Clérigo',  bc:'#d0d0d0',hc:'#e8e8e8',sc:'#c0a040'},
];

const INI_TPS=[
  {n:'Goblin',   bc:'#406820',hc:'#507830',pv:7, ca:12},
  {n:'Orc',      bc:'#508030',hc:'#608040',pv:15,ca:13},
  {n:'Esqueleto',bc:'#c8c8a0',hc:'#d8d8b0',pv:13,ca:13},
  {n:'Lobo',     bc:'#606070',hc:'#707080',pv:11,ca:13},
  {n:'Dragão',   bc:'#c03000',hc:'#e04000',pv:100,ca:17},
  {n:'Vampiro',  bc:'#200030',hc:'#300040',pv:77,ca:16},
  {n:'Zumbi',    bc:'#406040',hc:'#507050',pv:22,ca:8},
  {n:'Troll',    bc:'#305020',hc:'#406030',pv:84,ca:15},
  {n:'Cultista', bc:'#200020',hc:'#300030',pv:9, ca:12},
  {n:'Aranha',   bc:'#101010',hc:'#202020',pv:26,ca:13},
];

const NPC_TPS=[
  {n:'Taverneiro',bc:'#8a5030',hc:'#9a6040'},
  {n:'Guarda',    bc:'#606080',hc:'#707090'},
  {n:'Mercador',  bc:'#806030',hc:'#907040'},
  {n:'Mago NPC',  bc:'#4040a0',hc:'#5050b0'},
  {n:'Rei',       bc:'#c0a030',hc:'#d0b040'},
  {n:'Camponês',  bc:'#608040',hc:'#709050'},
];

const NARR_TPS=[
  {n:'🐉 MESTRE',c:'#f0d060'},
  {n:'💬 NPC',   c:'#60ee60'},
  {n:'📖 NARRADOR',c:'#a0c0ff'},
];

// ═══════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════
const cv=document.getElementById('canvas');
const ctx=cv.getContext('2d');
const mmcv=document.getElementById('mm-c');
const mmx=mmcv.getContext('2d');

let cen='floresta';
let mapW=80,mapH=60;
let tiles=[];      // tiles[y][x] = {type,color,passable}
let structs=[];    // estruturas/prédios: {x,y,w,h,type,...}
let sprites=[];
let player=null;
let invItems=[];
let showGrid=false;

let camX=0,camY=0;
let zoom=2;        // pixels por tile
let frame=0;

let drag=null,lastTap=0;
let pjCls=0,iniTp=0,npcTp=0,narrTp=0;
let pjHP=30,pjHPmax=30,pjMP=20,pjMPmax=20;

// ═══════════════════════════════════════════════════════
// GERAR MAPA top-down estilo UO
// ═══════════════════════════════════════════════════════
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function frand(){return Math.random();}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function wPick(arr){
  let t=arr.reduce((s,[w])=>s+w,0),r=frand()*t;
  for(const [w,v] of arr){r-=w;if(r<=0)return v;}
  return arr[arr.length-1][1];
}

function genMap(){
  mapW=+document.getElementById('cen-w').value||80;
  mapH=+document.getElementById('cen-h').value||60;
  const treeP=+document.getElementById('cen-t').value/100;
  const buildP=+document.getElementById('cen-b').value/100;
  const C=CENS[cen];

  // 1. Gerar tiles base com noise suave
  tiles=[];
  for(let y=0;y<mapH;y++){
    tiles[y]=[];
    for(let x=0;x<mapW;x++){
      const borda=x<2||y<2||x>=mapW-2||y>=mapH-2;
      const color=borda?C.water:wPick(C.ground);
      tiles[y][x]={type:borda?'water':'ground',color,pass:!borda,obst:null};
    }
  }

  // 2. Lagos/rios internos (cen floresta/deserto)
  if(cen==='floresta'||cen==='cidade'){
    // Rio horizontal
    const ry=rnd(Math.floor(mapH*.3),Math.floor(mapH*.6));
    for(let x=0;x<mapW;x++){
      for(let dy=-1;dy<=2;dy++){
        const cy2=ry+dy+Math.round(Math.sin(x*.2)*1.5);
        if(tiles[cy2]?.[x]){tiles[cy2][x]={type:'water',color:C.water,pass:false,obst:null};}
      }
    }
    // Pontes
    [Math.floor(mapW*.3),Math.floor(mapW*.65)].forEach(bx=>{
      for(let dy=-1;dy<=2;dy++){
        const cy2=ry+dy+Math.round(Math.sin(bx*.2)*1.5);
        if(tiles[cy2]?.[bx]){tiles[cy2][bx]={type:'bridge',color:C.road,pass:true,obst:null};}
        if(tiles[cy2]?.[bx+1]){tiles[cy2][bx+1]={type:'bridge',color:C.road,pass:true,obst:null};}
      }
    });
    // Lago
    const lx=rnd(10,mapW-15),ly=rnd(5,mapH-10);
    const lrx=rnd(4,8),lry=rnd(3,6);
    for(let dy=-lry;dy<=lry;dy++){
      for(let dx=-lrx;dx<=lrx;dx++){
        if(dx*dx/lrx/lrx+dy*dy/lry/lry<=1){
          const tx=lx+dx,ty=ly+dy;
          if(tiles[ty]?.[tx])tiles[ty][tx]={type:'water',color:C.water,pass:false,obst:null};
        }
      }
    }
  }

  // 3. Estradas principais
  const roads=[];
  // Horizontal centro
  const ry2=Math.floor(mapH/2);
  roads.push({x1:2,y1:ry2,x2:mapW-3,y2:ry2,horiz:true});
  // Vertical centro
  const rx2=Math.floor(mapW/2);
  roads.push({x1:rx2,y1:2,x2:rx2,y2:mapH-3,horiz:false});
  // Extra
  roads.push({x1:2,y1:Math.floor(mapH*.25),x2:mapW-3,y2:Math.floor(mapH*.25),horiz:true});
  roads.push({x1:2,y1:Math.floor(mapH*.75),x2:mapW-3,y2:Math.floor(mapH*.75),horiz:true});
  roads.push({x1:Math.floor(mapW*.25),y1:2,x2:Math.floor(mapW*.25),y2:mapH-3,horiz:false});
  roads.push({x1:Math.floor(mapW*.75),y1:2,x2:Math.floor(mapW*.75),y2:mapH-3,horiz:false});

  roads.forEach(r=>{
    const steps=r.horiz?Math.abs(r.x2-r.x1):Math.abs(r.y2-r.y1);
    for(let i=0;i<=steps;i++){
      const tx=r.horiz?r.x1+i:r.x1;
      const ty=r.horiz?r.y1:r.y1+i;
      for(let d=-1;d<=1;d++){
        const nx=r.horiz?tx:tx+d;
        const ny=r.horiz?ty+d:ty;
        if(tiles[ny]?.[nx]&&tiles[ny][nx].type==='ground'){
          tiles[ny][nx]={type:'road',color:d===0?C.road:C.roadEdge,pass:true,obst:null};
        }
      }
    }
  });

  // 4. Estruturas / prédios
  structs=[];
  const numBuilds=Math.floor(mapW*mapH*buildP*.015);
  for(let bi=0;bi<numBuilds;bi++){
    const bw=rnd(4,9),bh=rnd(3,7);
    const bx=rnd(4,mapW-bw-4),by=rnd(4,mapH-bh-4);
    // Verificar se área está livre
    let ok=true;
    for(let dy=0;dy<bh&&ok;dy++)for(let dx=0;dx<bw&&ok;dx++){
      const t=tiles[by+dy]?.[bx+dx];
      if(!t||t.type==='water'||t.type==='road'||t.type==='bridge')ok=false;
    }
    for(const s of structs){if(Math.abs(s.x-bx)<bw+2&&Math.abs(s.y-by)<bh+2){ok=false;break;}}
    if(!ok)continue;

    const bc=pick(C.buildColors);
    const rc=pick(C.roofColors);
    const btype=pick(['house','shop','tower','ruin']);
    structs.push({x:bx,y:by,w:bw,h:bh,type:btype,bc,rc,label:genLabel(btype)});

    // Marcar tiles como ocupados
    for(let dy=0;dy<bh;dy++){
      for(let dx=0;dx<bw;dx++){
        if(tiles[by+dy]?.[bx+dx]){
          tiles[by+dy][bx+dx]={type:'building',color:bc,pass:false,obst:null};
        }
      }
    }
    // Porta (passável)
    const doorX=bx+Math.floor(bw/2),doorY=by+bh-1;
    if(tiles[doorY]?.[doorX]){tiles[doorY][doorX]={type:'door',color:'#4a2800',pass:true,obst:null};}
  }

  // 5. Árvores
  for(let y=3;y<mapH-3;y++){
    for(let x=3;x<mapW-3;x++){
      const t=tiles[y][x];
      if(t.type==='ground'&&frand()<treeP){
        t.obst='tree';t.pass=false;
      }
    }
  }

  // 6. Detalhes (pedras, arbustos, etc.)
  for(let y=3;y<mapH-3;y++){
    for(let x=3;x<mapW-3;x++){
      const t=tiles[y][x];
      if(t.type==='ground'&&!t.obst&&frand()<.04){
        t.obst=pick(['rock','bush','flower','stump']);
      }
    }
  }

  // 7. Reposicionar sprites no centro
  const cx=Math.floor(mapW/2),cy=Math.floor(mapH/2);
  if(player){player.tx=cx;player.ty=cy;}
  sprites.forEach((s,i)=>{s.tx=cx+(i%4-2)*3;s.ty=cy+Math.floor(i/4)*2+2;});

  // Centralizar câmera
  camX=cv.width/2-cx*zoom*TS;
  camY=cv.height/2-cy*zoom*TS;

  document.getElementById('loc-name').textContent=CENS[cen].n;
  hideM('m-cen');
  drawMM();
}

function genLabel(type){
  const labels={
    house:['Casa','Lar','Moradia','Choupana','Cabana'],
    shop:['Taverna','Ferreiro','Mercado','Loja','Armazém'],
    tower:['Torre','Bastião','Vigia','Atalaia'],
    ruin:['Ruína','Vestígio','Restos','Catacumba'],
  };
  return pick(labels[type]||labels.house);
}

// ═══════════════════════════════════════════════════════
// DESENHAR MAPA
// ═══════════════════════════════════════════════════════
function resize(){
  cv.width=window.innerWidth;
  cv.height=window.innerHeight;
}
window.addEventListener('resize',resize);

let animFrame=0;
function drawLoop(){
  animFrame++;
  frame=animFrame;
  draw();
  requestAnimationFrame(drawLoop);
}

function draw(){
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const C=CENS[cen];
  const tpx=TS*zoom;

  // Fundo
  ctx.fillStyle='#050504';ctx.fillRect(0,0,W,H);

  if(!tiles.length){
    ctx.fillStyle='#f0d060';ctx.font='bold 15px Courier New';ctx.textAlign='center';
    ctx.fillText('Toque em 🗺️ Cena para gerar o mapa',W/2,H/2-10);
    ctx.fillStyle='#888';ctx.font='12px Courier New';
    ctx.fillText('Adicione personagens com os botões',W/2,H/2+16);
    ctx.textAlign='left';
    drawSprites();return;
  }

  // Calcular tiles visíveis
  const x0=Math.max(0,Math.floor(-camX/tpx)-1);
  const y0=Math.max(0,Math.floor(-camY/tpx)-1);
  const x1=Math.min(mapW-1,Math.ceil((W-camX)/tpx)+1);
  const y1=Math.min(mapH-1,Math.ceil((H-camY)/tpx)+1);

  // Desenhar tiles base
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const t=tiles[ty]?.[tx];if(!t)continue;
      const px=camX+tx*tpx,py=camY+ty*tpx;
      drawTile(t,tx,ty,px,py,tpx,C);
    }
  }

  // Desenhar prédios (sobre os tiles)
  structs.forEach(s=>{
    const px=camX+s.x*tpx,py=camY+s.y*tpx;
    const bw=s.w*tpx,bh=s.h*tpx;
    if(px+bw<0||px>W||py+bh<0||py>H)return;
    drawBuilding(s,px,py,tpx);
  });

  // Grid
  if(showGrid){
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;
    for(let ty=y0;ty<=y1;ty++){
      for(let tx=x0;tx<=x1;tx++){
        ctx.strokeRect(camX+tx*tpx,camY+ty*tpx,tpx,tpx);
      }
    }
  }

  // Coordenadas de mapa (a cada 10 tiles)
  ctx.fillStyle='rgba(255,255,200,.2)';ctx.font=`${Math.max(7,tpx*.4)}px Courier New`;
  for(let ty=y0;ty<=y1;ty+=10){
    for(let tx=x0;tx<=x1;tx+=10){
      ctx.fillText(`${tx},${ty}`,camX+tx*tpx+1,camY+ty*tpx+tpx*.5);
    }
  }

  drawSprites();
  drawMM();
}

function drawTile(t,tx,ty,px,py,tpx,C){
  // Base
  ctx.fillStyle=t.color;
  ctx.fillRect(px,py,tpx,tpx);

  // Variação de cor para dar textura
  if(t.type==='ground'||t.type==='road'){
    const v=(Math.sin(tx*3.7+ty*2.3)*.08+Math.cos(tx*1.9+ty*4.1)*.06);
    ctx.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},0,${Math.abs(v)*.15})`;
    ctx.fillRect(px,py,tpx,tpx);
  }

  // Água animada
  if(t.type==='water'){
    const w=Math.sin(frame*.05+tx*.3+ty*.2)*.12+.88;
    ctx.fillStyle=C.waterEdge;ctx.fillRect(px,py,tpx*.5,tpx);
    ctx.fillStyle=t.color;ctx.fillRect(px+tpx*.5,py,tpx*.5,tpx);
    ctx.fillStyle=`rgba(180,210,255,${w*.08})`;ctx.fillRect(px,py,tpx,tpx);
    // Ondas
    if(tpx>=8){
      ctx.strokeStyle=`rgba(255,255,255,${.15*w})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(px+tpx*.1,py+tpx*.4+Math.sin(frame*.08+tx*.5)*tpx*.1);
      ctx.lineTo(px+tpx*.9,py+tpx*.4+Math.sin(frame*.08+tx*.5+1)*tpx*.1);ctx.stroke();
    }
    return;
  }

  // Ponte
  if(t.type==='bridge'){
    const planks=3;
    for(let i=0;i<planks;i++){
      ctx.fillStyle=i%2===0?'#7a5030':'#6a4020';
      ctx.fillRect(px+tpx*i/planks,py,tpx/planks,tpx);
    }
    ctx.strokeStyle='#4a2810';ctx.lineWidth=.5;ctx.strokeRect(px,py,tpx,tpx);
    return;
  }

  // Porta
  if(t.type==='door'){
    ctx.fillStyle='#4a2800';ctx.fillRect(px,py,tpx,tpx);
    ctx.fillStyle='#c08040';ctx.fillRect(px+tpx*.2,py+tpx*.1,tpx*.6,tpx*.85);
    ctx.fillStyle='#f0d060';ctx.fillRect(px+tpx*.7,py+tpx*.45,tpx*.1,tpx*.1);
    return;
  }

  // Obstáculos
  if(t.obst&&tpx>=6){
    drawObst(t.obst,px,py,tpx);
  }
}

function drawObst(type,px,py,tpx){
  const cx=px+tpx/2,cy=py+tpx/2;
  switch(type){
    case 'tree':{
      // Sombra
      ctx.fillStyle='rgba(0,0,0,.25)';
      ctx.beginPath();ctx.ellipse(cx+tpx*.1,cy+tpx*.3,tpx*.38,tpx*.15,0,0,Math.PI*2);ctx.fill();
      // Tronco
      ctx.fillStyle='#5a3010';ctx.fillRect(cx-tpx*.07,cy,tpx*.14,tpx*.35);
      // Copa - camadas
      const layers=3;
      for(let i=layers;i>=0;i--){
        const r=tpx*(0.25+i*0.06);
        const ly=cy-tpx*(0.1+i*0.12);
        ctx.beginPath();ctx.arc(cx,ly,r,0,Math.PI*2);
        ctx.fillStyle=i%2===0?'#2d6b1a':'#1e5010';ctx.fill();
        if(i===layers){ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=.5;ctx.stroke();}
      }
      // Highlight
      ctx.fillStyle='rgba(255,255,255,.12)';
      ctx.beginPath();ctx.arc(cx-tpx*.08,cy-tpx*.28,tpx*.1,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'rock':{
      ctx.fillStyle='rgba(0,0,0,.2)';
      ctx.beginPath();ctx.ellipse(cx,cy+tpx*.2,tpx*.28,tpx*.1,0,0,Math.PI*2);ctx.fill();
      const g=ctx.createRadialGradient(cx-tpx*.1,cy-tpx*.1,tpx*.02,cx,cy,tpx*.25);
      g.addColorStop(0,'#909090');g.addColorStop(1,'#505050');
      ctx.beginPath();
      ctx.moveTo(cx-tpx*.25,cy+tpx*.1);ctx.lineTo(cx-tpx*.1,cy-tpx*.22);
      ctx.lineTo(cx+tpx*.18,cy-tpx*.18);ctx.lineTo(cx+tpx*.25,cy+tpx*.08);
      ctx.closePath();ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=.5;ctx.stroke();
      break;
    }
    case 'bush':{
      ctx.fillStyle='rgba(0,0,0,.18)';
      ctx.beginPath();ctx.ellipse(cx,cy+tpx*.2,tpx*.3,tpx*.1,0,0,Math.PI*2);ctx.fill();
      [[-.15,0,.22],[.15,-.05,.2],[0,.08,.18],[-.1,-.1,.16]].forEach(([ox,oy,r])=>{
        ctx.beginPath();ctx.arc(cx+ox*tpx,cy+oy*tpx,r*tpx,0,Math.PI*2);
        ctx.fillStyle='#2a7018';ctx.fill();
      });
      break;
    }
    case 'flower':{
      ctx.fillStyle='#2a7018';
      ctx.fillRect(cx-tpx*.03,cy,tpx*.06,tpx*.3);
      const fc=pick(['#ff6080','#ffff40','#ff8040','#ff40ff','#40ffff']);
      ctx.fillStyle=fc;
      ctx.beginPath();ctx.arc(cx,cy,tpx*.12,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'stump':{
      ctx.fillStyle='#3a1c08';
      ctx.beginPath();ctx.ellipse(cx,cy+tpx*.15,tpx*.22,tpx*.1,0,0,Math.PI*2);ctx.fill();
      ctx.fillRect(cx-tpx*.2,cy-tpx*.15,tpx*.4,tpx*.3);
      ctx.fillStyle='#6a3818';
      ctx.beginPath();ctx.ellipse(cx,cy-tpx*.15,tpx*.2,tpx*.09,0,0,Math.PI*2);ctx.fill();
      break;
    }
  }
}

function drawBuilding(s,px,py,tpx){
  const bw=s.w*tpx,bh=s.h*tpx;

  // Sombra do prédio
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.fillRect(px+tpx*.5,py+tpx*.5,bw,bh);

  // Chão interno
  ctx.fillStyle=s.bc;ctx.fillRect(px,py,bw,bh);

  // Paredes (mais escuras nas bordas)
  const wallW=Math.max(2,tpx*.35);
  const wallD=darken(s.bc,.25);
  ctx.fillStyle=wallD;
  ctx.fillRect(px,py,bw,wallW);           // topo
  ctx.fillRect(px,py+bh-wallW,bw,wallW); // base
  ctx.fillRect(px,py,wallW,bh);           // esq
  ctx.fillRect(px+bw-wallW,py,wallW,bh); // dir

  // Telhado
  const roofH=bh*.45;
  ctx.fillStyle=s.rc;
  ctx.beginPath();
  ctx.moveTo(px,py);ctx.lineTo(px+bw/2,py-roofH);ctx.lineTo(px+bw,py);ctx.closePath();
  ctx.fill();
  ctx.strokeStyle=darken(s.rc,.2);ctx.lineWidth=1;ctx.stroke();
  // Linha do meio do telhado
  ctx.strokeStyle=darken(s.rc,.3);ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(px+bw*.1,py-roofH*.7);ctx.lineTo(px+bw*.9,py-roofH*.7);ctx.stroke();

  // Janelas
  if(tpx>=4&&s.w>=5){
    const winsz=Math.max(2,tpx*.8);
    const winPositions=[];
    if(s.w>=7){winPositions.push([bw*.25,bh*.3],[bw*.65,bh*.3]);}
    else{winPositions.push([bw*.4,bh*.3]);}
    if(s.h>=5)winPositions.forEach(([wx,wy])=>winPositions.push([wx,bh*.6]));
    winPositions.forEach(([wx,wy])=>{
      ctx.fillStyle='#d0c060';ctx.fillRect(px+wx-winsz/2,py+wy-winsz/2,winsz,winsz);
      ctx.strokeStyle='#5a3a10';ctx.lineWidth=.5;ctx.strokeRect(px+wx-winsz/2,py+wy-winsz/2,winsz,winsz);
      // Cruz na janela
      ctx.beginPath();ctx.moveTo(px+wx,py+wy-winsz/2);ctx.lineTo(px+wx,py+wy+winsz/2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px+wx-winsz/2,py+wy);ctx.lineTo(px+wx+winsz/2,py+wy);ctx.stroke();
    });
  }

  // Chaminé
  if(s.type==='house'&&tpx>=5){
    const chimx=px+bw*.75,chimy=py-roofH*.6;
    ctx.fillStyle=darken(s.bc,.1);ctx.fillRect(chimx,chimy-tpx*.3,tpx*.25,tpx*.35);
    if(frame%20<10){
      ctx.fillStyle='rgba(200,200,200,.3)';
      ctx.beginPath();ctx.arc(chimx+tpx*.12,chimy-tpx*.38,tpx*.12,0,Math.PI*2);ctx.fill();
    }
  }

  // Borda do prédio
  ctx.strokeStyle=darken(s.bc,.35);ctx.lineWidth=1;ctx.strokeRect(px,py,bw,bh);

  // Label
  if(tpx>=5&&s.label){
    const lx=px+bw/2,ly=py-roofH-3;
    const lw=ctx.measureText(s.label).width;
    ctx.font=`bold ${Math.max(7,tpx*.55)}px Courier New`;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(lx-lw/2-2,ly-10,lw+4,11);
    ctx.fillStyle='#f0d060';ctx.textAlign='center';ctx.fillText(s.label,lx,ly);ctx.textAlign='left';
  }

  // Porta desenhada na frente
  const dox=px+Math.floor(s.w/2)*tpx-tpx*.3;
  const doy=py+bh-tpx*.2;
  ctx.fillStyle='#7a4018';ctx.fillRect(dox,doy,tpx*.6,tpx*.3);
  ctx.fillStyle='#c07030';ctx.fillRect(dox+tpx*.05,doy,tpx*.5,tpx*.25);
  ctx.fillStyle='#f0d060';ctx.fillRect(dox+tpx*.45,doy+tpx*.1,tpx*.05,tpx*.05);
}

// ═══════════════════════════════════════════════════════
// SPRITES (personagens)
// ═══════════════════════════════════════════════════════
function drawSprites(){
  const tpx=TS*zoom;
  const sorted=[...sprites];
  if(player)sorted.push(player);
  sorted.sort((a,b)=>a.ty-b.ty);

  sorted.forEach(s=>{
    const px=camX+s.tx*tpx+tpx/2;
    const py=camY+s.ty*tpx+tpx*.6;
    const sz=Math.max(6,tpx*.9);
    drawChar(s,px,py,sz);
  });
}

function drawChar(s,cx,cy,sz){
  const isP=s===player;
  const bob=isP?Math.sin(frame*.15)*sz*.05:0;
  const y=cy+bob;
  const bc=s.bc||'#8080b0',hc=s.hc||'#a0a0d0';

  // Sombra
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(cx,cy+sz*.15,sz*.22,sz*.08,0,0,Math.PI*2);ctx.fill();

  // Corpo
  ctx.fillStyle=bc;ctx.fillRect(cx-sz*.18,y-sz*.38,sz*.36,sz*.38);
  // Escurecimento lateral
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(cx+sz*.08,y-sz*.38,sz*.1,sz*.38);

  // Pernas
  ctx.fillStyle=darken(bc,.3);
  ctx.fillRect(cx-sz*.15,y,sz*.12,sz*.22);
  ctx.fillRect(cx+sz*.03,y,sz*.12,sz*.22);
  // Botas
  ctx.fillStyle='#251508';
  ctx.fillRect(cx-sz*.17,y+sz*.17,sz*.16,sz*.08);
  ctx.fillRect(cx+sz*.01,y+sz*.17,sz*.16,sz*.08);

  // Braços
  ctx.fillStyle=bc;
  ctx.fillRect(cx-sz*.3,y-sz*.35,sz*.12,sz*.28);
  ctx.fillRect(cx+sz*.18,y-sz*.35,sz*.12,sz*.28);

  // Cabeça
  const skinC=s.tipo==='inimigo'?
    (s.iniIdx===2?'#d0d0a0':s.bc):
    '#c8905a';
  ctx.fillStyle=skinC;
  ctx.beginPath();ctx.arc(cx,y-sz*.52,sz*.18,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=.5;ctx.stroke();

  // Olhos
  ctx.fillStyle='#101010';
  ctx.beginPath();ctx.arc(cx-sz*.07,y-sz*.54,sz*.04,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+sz*.07,y-sz*.54,sz*.04,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();ctx.arc(cx-sz*.05,y-sz*.56,sz*.015,0,Math.PI*2);ctx.fill();

  // Capacete
  ctx.fillStyle=hc;
  ctx.beginPath();ctx.arc(cx,y-sz*.65,sz*.19,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillRect(cx-sz*.2,y-sz*.66,sz*.4,sz*.07);

  // Arma (PJ e inimigos)
  if(s.tipo!=='npc'){
    ctx.fillStyle='#b0b0c0';
    ctx.fillRect(cx+sz*.22,y-sz*.7,sz*.05,sz*.55);
    ctx.fillStyle='#d0a030';
    ctx.fillRect(cx+sz*.13,y-sz*.62,sz*.23,sz*.05);
  }

  // Label turno (jogador)
  if(isP){
    ctx.fillStyle='#f0d060';
    ctx.beginPath();ctx.moveTo(cx,y-sz*.92);ctx.lineTo(cx-sz*.1,y-sz*.76);ctx.lineTo(cx+sz*.1,y-sz*.76);ctx.closePath();ctx.fill();
  }

  // Inimigo indicator
  if(s.tipo==='inimigo'){
    ctx.fillStyle='#ff3030';ctx.font=`${sz*.35}px Arial`;ctx.textAlign='center';
    ctx.fillText('▼',cx,y-sz*.95);ctx.textAlign='left';
  }

  // Nome
  const nm=s.nome.slice(0,10);
  ctx.font=`bold ${Math.max(8,sz*.28)}px Courier New`;
  const nw=ctx.measureText(nm).width;
  const nlx=cx-nw/2,nly=y-sz*1.0;
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(nlx-2,nly-10,nw+4,12);
  ctx.fillStyle=s.tipo==='inimigo'?'#ff8080':s.tipo==='npc'?'#80ff80':isP?'#f0d060':'#80c0ff';
  ctx.fillText(nm,nlx,nly);

  // Barra HP
  if(s.hp!==undefined){
    const bw=sz*.55,bx=cx-bw/2,by=y-sz*.84;
    ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(bx-1,by-1,bw+2,6);
    const pct=s.hp/s.hpMax;
    ctx.fillStyle=pct>0.5?'#0a0':pct>0.25?'#880':'#a00';
    ctx.fillRect(bx,by,bw*pct,4);
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=.5;ctx.strokeRect(bx,by,bw,4);
  }

  // Selecionado
  if(s.sel){
    ctx.strokeStyle='#f0d060';ctx.lineWidth=2;ctx.setLineDash([3,2]);
    ctx.beginPath();ctx.arc(cx,y,sz*.35,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ═══════════════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════════════
function drawMM(){
  if(!tiles.length)return;
  const mw=88,mh=68;
  const tw=mw/mapW,th=mh/mapH;
  mmx.clearRect(0,0,mw,mh);
  for(let y=0;y<mapH;y++){
    for(let x=0;x<mapW;x++){
      const t=tiles[y][x];
      mmx.fillStyle=t.type==='water'?'#1a3a8a':t.type==='road'||t.type==='bridge'?'#5a4520':t.obst?'#1a4010':t.color;
      mmx.fillRect(x*tw,y*th,tw+.5,th+.5);
    }
  }
  // Prédios
  structs.forEach(s=>{mmx.fillStyle='#c8a050';mmx.fillRect(s.x*tw,s.y*th,s.w*tw,s.h*th);});
  // Sprites
  sprites.forEach(s=>{
    mmx.fillStyle=s.tipo==='inimigo'?'#ff3030':'#40dd40';
    mmx.fillRect(s.tx*tw-1,s.ty*th-1,3,3);
  });
  // Jogador
  if(player){
    mmx.fillStyle='#f0d060';
    mmx.beginPath();mmx.arc(player.tx*tw,player.ty*th,2.5,0,Math.PI*2);mmx.fill();
  }
  // Câmera viewport
  const tpx=TS*zoom;
  const vx=((-camX)/tpx)*tw,vy=((-camY)/tpx)*th;
  const vw=(cv.width/tpx)*tw,vh=(cv.height/tpx)*th;
  mmx.strokeStyle='rgba(255,255,255,.4)';mmx.lineWidth=1;
  mmx.strokeRect(vx,vy,vw,vh);
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
cv.addEventListener('pointerdown',e=>{
  const px=e.clientX,py=e.clientY;
  const now=Date.now();
  const{tx,ty}=screen2map(px,py);

  // Hit sprite
  const hit=hitSprite(px,py);
  if(hit){
    sprites.forEach(s=>s.sel=false);if(player)player.sel=false;
    hit.sel=true;
    if(hit.tipo==='npc'&&hit.fala)narr('💬 '+hit.nome.toUpperCase(),hit.fala,'#60ee60');
    else if(hit.tipo==='inimigo'){
      document.getElementById('combate-btn').style.display='block';
      narr('⚠️ INIMIGO!',`**${hit.nome}** — HP: ${hit.hp}/${hit.hpMax} | CA: ${hit.ca}`,'#ff4040');
    }
    else if(hit===player)narr('👤 '+hit.nome.toUpperCase(),`HP: ${hit.hp}/${hit.hpMax}`,'#f0d060');
    return;
  }

  // Double tap mover
  if(now-lastTap<300){
    if(player&&tx>=0&&ty>=0&&tx<mapW&&ty<mapH){
      const t=tiles[ty]?.[tx];
      if(t&&t.pass)movePlayer(tx,ty);
      else narr('🐉 MESTRE','*Passagem bloqueada.* Há algo no caminho. **O que você faz?**','#f0d060');
    }
    lastTap=0;return;
  }
  lastTap=now;

  drag={px,py,cx:camX,cy:camY};
  cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  camX=drag.cx+(e.clientX-drag.px);
  camY=drag.cy+(e.clientY-drag.py);
},{passive:true});

cv.addEventListener('pointerup',()=>drag=null);

// Pinch zoom
let lp2=0;
cv.addEventListener('touchstart',e=>{if(e.touches.length===2)lp2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lp2>0)zoom=Math.max(.5,Math.min(5,zoom*(d/lp2)));
    lp2=d;
  }
},{passive:true});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(5,zoom*(e.deltaY<0?1.12:.88)));},{passive:false});

function screen2map(sx,sy){
  const tpx=TS*zoom;
  return{tx:Math.floor((sx-camX)/tpx),ty:Math.floor((sy-camY)/tpx)};
}

function hitSprite(px,py){
  const tpx=TS*zoom;const sz=tpx*.9;
  const all=[...sprites];if(player)all.push(player);
  for(let i=all.length-1;i>=0;i--){
    const s=all[i];
    const cx=camX+s.tx*tpx+tpx/2,cy=camY+s.ty*tpx+tpx*.6;
    if(Math.abs(px-cx)<sz*.35&&Math.abs(py-(cy-sz*.3))<sz*.5)return s;
  }
  return null;
}

// ═══════════════════════════════════════════════════════
// MOVER JOGADOR
// ═══════════════════════════════════════════════════════
let moveInt=null;
function movePlayer(tx,ty){
  if(!player)return;
  if(moveInt)clearInterval(moveInt);
  const ox=player.tx,oy=player.ty;
  const dist=Math.abs(tx-ox)+Math.abs(ty-oy);
  const steps=Math.max(2,dist);
  let s=0;
  moveInt=setInterval(()=>{
    s++;player.tx=ox+Math.round((tx-ox)*s/steps);player.ty=oy+Math.round((ty-oy)*s/steps);
    // Centralizar câmera no jogador
    const tpx=TS*zoom;
    const targetX=cv.width/2-player.tx*tpx-tpx/2;
    const targetY=cv.height/2-player.ty*tpx-tpx*.6;
    camX=camX+(targetX-camX)*.12;
    camY=camY+(targetY-camY)*.12;
    if(s>=steps){clearInterval(moveInt);moveInt=null;}
    // Inimigos próximos
    const near=sprites.filter(sp=>sp.tipo==='inimigo'&&Math.abs(sp.tx-player.tx)<=2&&Math.abs(sp.ty-player.ty)<=2);
    document.getElementById('combate-btn').style.display=near.length?'block':'none';
  },45);
}

function centerCam(){
  if(!player)return;
  const tpx=TS*zoom;
  camX=cv.width/2-player.tx*tpx-tpx/2;
  camY=cv.height/2-player.ty*tpx-tpx*.6;
}

// ═══════════════════════════════════════════════════════
// SPRITES
// ═══════════════════════════════════════════════════════
function freePos(near=false){
  const cx=Math.floor(mapW/2),cy=Math.floor(mapH/2);
  for(let t=0;t<400;t++){
    const ox=near?rnd(-4,4):rnd(-8,8),oy=near?rnd(-4,4):rnd(-6,6);
    const nx=cx+ox,ny=cy+oy;
    if(nx<2||ny<2||nx>=mapW-2||ny>=mapH-2)continue;
    const tile=tiles[ny]?.[nx];
    if(!tile||!tile.pass)continue;
    const occ=[...sprites,player].filter(Boolean).some(s=>s.tx===nx&&s.ty===ny);
    if(!occ)return{tx:nx,ty:ny};
  }
  return{tx:cx,ty:cy};
}

function addSpr(tipo){
  if(tipo==='pj'){
    const nome=document.getElementById('pj-n').value.trim()||'Herói';
    const hp=+document.getElementById('pj-hp').value||30;
    const ca=+document.getElementById('pj-ca').value||15;
    const cls=PJ_CLS[pjCls];
    if(!player){
      const pos=freePos();
      player={nome,tipo:'pj',tx:pos.tx,ty:pos.ty,hp,hpMax:hp,ca,sel:false,...cls};
      pjHP=hp;pjHPmax=hp;
      document.getElementById('pj-hdr').textContent=nome;
      updateStats();centerCam();hideM('m-pj');return;
    }
    const pos=freePos();
    sprites.push({nome,tipo:'pj',tx:pos.tx,ty:pos.ty,hp,hpMax:hp,ca,sel:false,...cls});
  }else if(tipo==='ini'){
    const nome=document.getElementById('ini-n').value.trim()||'Inimigo';
    const hp=+document.getElementById('ini-hp').value||10;
    const ca=+document.getElementById('ini-ca').value||12;
    const qtd=Math.min(8,+document.getElementById('ini-qtd').value||1);
    const tp=INI_TPS[iniTp];
    for(let i=0;i<qtd;i++){
      const pos=freePos(true);
      sprites.push({nome:qtd>1?nome+' '+(i+1):nome,tipo:'inimigo',iniIdx:iniTp,tx:pos.tx,ty:pos.ty,hp,hpMax:hp,ca,sel:false,...tp});
    }
  }else{
    const nome=document.getElementById('npc-n').value.trim()||'NPC';
    const fala=document.getElementById('npc-f').value.trim()||'...';
    const tp=NPC_TPS[npcTp];
    const pos=freePos();
    sprites.push({nome,tipo:'npc',tx:pos.tx,ty:pos.ty,fala,sel:false,...tp});
  }
  hideM('m-'+tipo);
}

// ═══════════════════════════════════════════════════════
// NARRAÇÃO
// ═══════════════════════════════════════════════════════
let narrTimer2=null;
function narr(who,txt,cor='#f0d060'){
  const box=document.getElementById('narr');
  document.getElementById('narr-who').textContent=who;
  document.getElementById('narr-who').style.color=cor;
  document.getElementById('narr-txt').innerHTML=
    txt.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  box.style.display='block';
  if(narrTimer2)clearTimeout(narrTimer2);
  narrTimer2=setTimeout(closeNarr,9000);
}
function closeNarr(){document.getElementById('narr').style.display='none';}

function postNarr(){
  const txt=document.getElementById('narr-inp').value.trim();if(!txt)return;
  const t=NARR_TPS[narrTp];
  narr(t.n,txt,t.c);
  document.getElementById('narr-inp').value='';
  hideM('m-narr');
}

function quickAct(a){
  const msgs={
    examinar:['Você examina o ambiente. *Há marcas no chão* — alguém esteve aqui recentemente. **O que você faz?**','*Detalhes emergem à sua atenção.* Uma porta entreaberta, um rastro de pegadas. **O que você faz?**'],
    falar:['*O personagem para e te olha desconfiado.* **"Quem quer saber?"** — **Como você responde?**','**"Não é seguro conversar aqui,"** ela murmura. **"Me siga."**'],
    pegar:['Você procura por itens úteis. *Algo chama sua atenção.* Role **D20** para achar algo útil.','*Seus dedos encontram algo escondido.* **O que você pega?**'],
    magia:['*As palavras arcanas formam-se nos seus lábios.* Role **D20** (CD 12) para conjurar!','**A magia responde.** *Energia pulsa ao redor de você.* **O que você lança?**'],
  };
  narr('🐉 MESTRE',pick(msgs[a]),'#f0d060');
}

function rollD(l){
  const r=Math.floor(Math.random()*l)+1;
  const crit=r===l&&l>=10,fumb=r===1&&l>=10;
  narr(`🎲 D${l}`,`**${r}**${crit?' 💥 CRÍTICO!':fumb?' 💀 FUMBLE!':''}`,crit?'#f0d060':fumb?'#ff4040':'#80c0ff');
}

function updateStats(){
  document.getElementById('bar-hp').style.width=(pjHP/pjHPmax*100)+'%';

// ═══════════════════════════════════════════════════════
function invAdd(){
  const v=document.getElementById('inv-add').value.trim();if(!v)return;
  invItems.push(v);document.getElementById('inv-add').value='';renderInv();
}
function renderInv(){
  const el=document.getElementById('inv-list');
  el.innerHTML=invItems.length?invItems.map((item,i)=>
    `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1e1400">
      <span>▪ ${item}</span>
      <button onclick="invItems.splice(${i},1);renderInv()" style="background:transparent;border:none;color:#703030;font-size:11px">✕</button>
    </div>`).join(''):'<span style="color:#444">Vazio</span>';
}

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
function darken(hex,amt){
  try{
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.max(0,Math.round(r*(1-amt)));g=Math.max(0,Math.round(g*(1-amt)));b=Math.max(0,Math.round(b*(1-amt)));
    return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }catch{return hex;}
}

function goCombate(){window.open('combate.html','_blank');}
function toggleGrid(){showGrid=!showGrid;}
function showM(id){document.getElementById(id).style.display='flex';}
function hideM(id){document.getElementById(id).style.display='none';}

// INIT MODAIS
// ═══════════════════════════════════════════════════════
function initUI(){
  // PJ Classes
  document.getElementById('pj-cls').innerHTML=PJ_CLS.map((c,i)=>
    `<button class="tgb${i===pjCls?' on':''}" onclick="pjCls=${i};document.querySelectorAll('#pj-cls .tgb').forEach((b,j)=>b.classList.toggle('on',j===${i}))">${c.n}</button>`
  ).join('');
  // Inimigos
  document.getElementById('ini-tg').innerHTML=INI_TPS.map((t,i)=>
    `<button class="tgb${i===iniTp?' on':''}" onclick="selIni(${i},this)">${t.n}</button>`
  ).join('');
  // NPCs
  document.getElementById('npc-tg').innerHTML=NPC_TPS.map((t,i)=>
    `<button class="tgb${i===npcTp?' on':''}" onclick="npcTp=${i};document.querySelectorAll('#npc-tg .tgb').forEach((b,j)=>b.classList.toggle('on',j===${i}))">${t.n}</button>`
  ).join('');
  // Cenários
  document.getElementById('cen-tg').innerHTML=Object.entries(CENS).map(([k,v])=>
    `<button class="tgb${k===cen?' on':''}" id="cenb-${k}" onclick="selCen('${k}')">${v.n}</button>`
  ).join('');
  // Narr
  document.getElementById('narr-tg').innerHTML=NARR_TPS.map((t,i)=>
    `<button class="tgb${i===narrTp?' on':''}" onclick="narrTp=${i};document.querySelectorAll('#narr-tg .tgb').forEach((b,j)=>b.classList.toggle('on',j===${i}))">${t.n}</button>`
  ).join('');
}

function selIni(i,btn){
  iniTp=i;const t=INI_TPS[i];
  document.getElementById('ini-n').value=t.n;
  document.getElementById('ini-hp').value=t.pv;
  document.getElementById('ini-ca').value=t.ca;
  document.querySelectorAll('#ini-tg .tgb').forEach((b,j)=>b.classList.toggle('on',j===i));
}
function selCen(k){
  cen=k;
  document.querySelectorAll('[id^="cenb-"]').forEach(b=>b.classList.toggle('on',b.id==='cenb-'+k));
}
